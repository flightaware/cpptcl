name: Mac CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v2
    - name: Install dependencies
      run: |
        brew update
        brew reinstall tcl-tk@8
    - name: make
      run: make
    - name: install
      run: sudo make install
    - name: make test
      run: make test
    - name: make examples
      run: make examples
